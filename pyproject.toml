[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yespm-backend"
version = "0.3.0"
description = "YesPM - AI 驱动的 PRD 文档生成器（无头会话引擎 + 协议层 + 三前端入口）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "openai>=2.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yespm = "yespm_backend.entry.cli:main"
yespm-server = "yespm_backend.entry.server_stdio:main"
yespm-ws = "yespm_backend.entry.server_ws:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yespm_backend" = ["prompts/*.txt", "template/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
