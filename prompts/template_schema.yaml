# YesPM 默认 PRD 模板
# 本文件为「问答驱动元数据」与「渲染脚手架」的唯一真源。
# 用户可完全自定义，只要符合 docs/TEMPLATE_SPEC.md 规范即可。

# ───────────── 一、文档信息 ─────────────
- title: 文档信息
  tier: P1
  children:
    - title: 基本信息
      children:
        - title: 文档版本
          default: "v1.0"
        - title: 创建日期
        - title: 作者
    - title: 产品标识
      children:
        - title: 产品名称
          required: true
        - title: 产品代号

# ───────────── 二、产品概述 ─────────────
- title: 产品概述
  tier: P0
  children:
      - title: 一句话定位
        tier: P0
        required: true
        description: 用一句话描述产品是什么、解决谁的什么问题。