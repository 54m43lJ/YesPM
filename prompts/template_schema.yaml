# YesPM 默认 PRD 模板
# 本文件为「问答驱动元数据」与「渲染脚手架」的唯一真源。
# 用户可完全自定义，只要符合 docs/TEMPLATE_SPEC.md 规范即可。

# ───────────── 一、文档信息 ─────────────
- title: 文档信息
  tier: P1
  children:
    - title: 基本信息
      children:
        - title: 文档版本
          default: "v1.0"
        - title: 创建日期
        - title: 作者
    - title: 产品标识
      children:
        - title: 产品名称
          required: true
        - title: 产品代号

# ───────────── 二、产品概述 ─────────────
- title: 产品概述
  tier: P0
  children:
    - title: 产品定位
      tier: P0
      children:
        - title: 一句话定位
          required: true
          description: 用一句话描述产品是什么、解决谁的什么问题。
        - title: 解决的核心问题
          required: true
    - title: 目标用户
      item_label: 用户角色
      tier: P0
      min_items: 1
      children:
        - title: 角色名称
          required: true
        - title: 角色描述
        - title: 核心诉求
    - title: 产品目标
      tier: P0
      children:
        - title: 业务目标
          required: true
        - title: 用户价值目标
        - title: 衡量指标 (KPI)
          tier: P1
    - title: 竞品与差异化
      tier: P2
      children:
        - title: 主要竞品
        - title: 差异化优势

# ───────────── 三、功能需求 ─────────────
- title: 功能需求
  tier: P0
  children:
    - title: 功能模块划分
      required: true
      description: 列出主要功能模块，作为功能详述的总览。
    - title: 核心功能详述
      item_label: 功能
      tier: P0
      min_items: 1
      children:
        - title: 功能名称
          required: true
        - title: 功能描述
          required: true
        - title: 用户操作流程
          children:
            - title: 主流程
            - title: 异常分支
              tier: P1
        - title: 前置条件
        - title: 后置条件
        - title: 业务规则
        - title: 异常与边界处理
          tier: P1
          children:
            - title: 异常场景清单
            - title: 兜底策略

# ───────────── 四、非功能需求 ─────────────
- title: 非功能需求
  tier: P1
  children:
    - title: 性能
      children:
        - title: 响应时间
        - title: 并发与吞吐
    - title: 安全性
      children:
        - title: 鉴权与授权
        - title: 数据安全
    - title: 可用性
    - title: 兼容性
      children:
        - title: 平台兼容
        - title: 浏览器/设备兼容
    - title: 可扩展性

# ───────────── 五、用户场景 ─────────────
- title: 用户场景
  tier: P0
  children:
    - title: 用户故事
      item_label: 用户故事
      tier: P0
      min_items: 1
      children:
        - title: 编号
          default: "US-{n}"
        - title: 角色
          required: true
        - title: 场景
          required: true
        - title: 期望结果
        - title: 优先级
          field_type: enum
          enum_values: [P0, P1, P2]
    - title: 核心使用路径
      tier: P1

# ───────────── 六、界面与交互 ─────────────
- title: 界面与交互
  tier: P1
  children:
    - title: 信息架构
    - title: 核心页面
      item_label: 页面
      children:
        - title: 页面用途
        - title: 核心元素
        - title: 页面流转
    - title: 交互规范
      children:
        - title: 操作反馈规范
        - title: 错误提示规范

# ───────────── 七、数据需求 ─────────────
- title: 数据需求
  tier: P1
  children:
    - title: 数据模型
      children:
        - title: 核心实体
        - title: 实体关系
    - title: 数据流转
      children:
        - title: 数据来源
        - title: 数据去向
    - title: 数据存储与合规
      tier: P2

# ───────────── 八、里程碑与排期 ─────────────
- title: 里程碑与排期
  tier: P1
  children:
    - title: 阶段划分
    - title: 里程碑明细
      item_label: 里程碑
      children:
        - title: 内容
        - title: 预计时间
        - title: 交付物
        - title: 依赖项
          tier: P2

# ───────────── 九、风险与假设 ─────────────
- title: 风险与假设
  tier: P1
  children:
    - title: 风险登记
      item_label: 风险
      children:
        - title: 风险描述
          required: true
        - title: 影响评估
        - title: 应对措施
        - title: 责任人
          tier: P2
    - title: 假设与依赖
      children:
        - title: 业务假设
        - title: 技术依赖

# ───────────── 十、附录 ─────────────
- title: 附录
  tier: P2
  children:
    - title: 术语表
    - title: 参考资料
    - title: 变更记录
